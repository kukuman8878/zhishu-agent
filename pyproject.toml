[project]
name = "zhishu-agent"
version = "0.1.0"
description = "智能数据分析 Agent：自然语言 → 元数据混合检索 → SQL 生成/校验/执行 → SSE 流式回答；内置进程内多模态文档问答引擎"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.10.0",
    "asyncmy>=0.2.11",
    "cryptography>=46.0.7",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.135.3",
    "greenlet>=3.4.0",
    "huggingface-hub>=1.10.1",
    "jieba>=0.42.1",
    "langchain>=1.2.15",
    "langchain-huggingface>=1.2.1",
    "langchain-openai>=1.0.0",
    "langgraph>=1.1.6",
    "loguru>=0.7.3",
    "nano-vectordb>=0.0.4.3",
    "omegaconf>=2.3.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.17.1",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
